services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calendar_booking
      POSTGRES_PASSWORD: calendar_booking
      POSTGRES_USER: calendar_booking
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calendar_booking -d calendar_booking']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - calendar-booking-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://calendar_booking:calendar_booking@database:5432/calendar_booking
      PORT: ${APP_PORT:-3000}
    image: calendar-booking:local
    init: true
    ports:
      - '${APP_PORT:-3000}:${APP_PORT:-3000}'

volumes:
  calendar-booking-data:
